onboarding = false

[keys]
prefix = "ctrl+k"
detach = "prefix+d"
split_vertical = ["alt+backslash"]
split_horizontal = ["alt+minus"]
focus_pane_left = ["alt+h"]
focus_pane_down = ["alt+j"]
focus_pane_up = ["alt+k"]
focus_pane_right = ["alt+l"]
next_tab = ["prefix+n", "shift+alt+l"]
previous_tab = ["prefix+p", "shift+alt+h"]
previous_workspace = ["shift+alt+k"]
next_workspace = ["shift+alt+j"]
previous_agent = ["F2"]
next_agent = ["F3"]
focus_agent = ["ctrl+alt+1..9"]
new_workspace = ["ctrl+n"]

[ui.toast]
delivery = "system"

[ui.toast.clipboard]
enabled = true
position = "top-right"

[theme]
name = "gruvbox"
auto_switch = false

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "herdr plugin pane open --plugin ttt.editor --entrypoint editor"
description = "open TTT editor"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "cmd+o"
type = "shell"
command = "herdr plugin action invoke open-sidebar --plugin herdr-sidebar"
description = "toogle sidebar"

[[keys.command]]
key = "cmd+p"
type = "shell"
command = "herdr plugin action invoke show-explorer --plugin herdr-sidebar"
description = "sidebar show explorer"

[[keys.command]]
key = "cmd+shift+f"
type = "shell"
command = "herdr plugin action invoke show-search --plugin herdr-sidebar"
description = "sidebar show search"

[[keys.command]]
key = "cmd+g"
type = "shell"
command = "herdr plugin action invoke show-git --plugin herdr-sidebar"
description = "sidebar show git"

[[keys.command]]
key = "prefix+l"
type = "popup"
command = "~/.local/sbin/herdr-save-pane"
description = "save pane contents to $TMPDIR log"
width = "70%"
height = 9

[experimental]
kitty_graphics = true
