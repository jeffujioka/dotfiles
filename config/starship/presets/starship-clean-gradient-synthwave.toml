# ~/.config/starship.toml — clean · Synthwave palette
# Retro-futuristic: neon pink → magenta → violet → cyan
# Swap: cp starship-clean-gradient-synthwave.toml starship.toml

add_newline = true
command_timeout = 1000

format = """
[░▒▓](#d030a0)\
[ $os ](bg:#d030a0 fg:#0a0a0a)\
[](bg:#280830 fg:#d030a0)\
$username\
$hostname\
$directory\
[](fg:#280830 bg:#180840)\
${custom.giticon}\
$git_branch\
$git_status\
[](fg:#180840 bg:#080838)\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
[](fg:#080838 bg:#083030)\
$cmd_duration\
$battery\
$time\
[](fg:#083030)\
\n$character"""

continuation_prompt = '[▶▶](#d030a0) '

[fill]
symbol = '─'
style = '#080818'

[character]
success_symbol = '[❯](bold #ff60d0)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'bg:#d030a0'
format = '$symbol'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#ff60d0'
style_root = 'bold fg:#ff4444'
format = '[[ $user ](fg:#ff60d0 bg:#280830)]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'bg:#280830'
format = '[[@$hostname ](fg:#ff60d0 bg:#280830)]($style)'
disabled = false

[directory]
style = 'bg:#280830'
format = '[[ $path ](fg:#ff60d0 bg:#280830)]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾'
read_only_style = 'fg:#ff60d0 bg:#280830'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#180840'
format = '[[ $symbol$branch ](fg:#9050f0 bg:#180840)]($style)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#180840'
format = '[[($all_status$ahead_behind )](fg:#9050f0 bg:#180840)]($style)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'bg:#080838'
format = '[[ $symbol($version )(\($virtualenv\) )](fg:#6060ff bg:#080838)]($style)'
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'bg:#080838'
format = '[[ $symbol ($version) ](fg:#6060ff bg:#080838)]($style)'

[rust]
symbol = " "
style = 'bg:#080838'
format = '[[ $symbol ($version) ](fg:#6060ff bg:#080838)]($style)'

[java]
symbol = " "
style = 'bg:#080838'
format = '[[ $symbol ($version) ](fg:#6060ff bg:#080838)]($style)'

[c]
symbol = " "
style = 'bg:#080838'
format = '[[ $symbol ($version) ](fg:#6060ff bg:#080838)]($style)'
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'bg:#080838'
format = '[[ $symbol $context ](fg:#6060ff bg:#080838)]($style)'

[cmd_duration]
min_time = 2000
style = 'bg:#083030'
format = '[[ ⏱ $duration ](fg:#30d0e0 bg:#083030)]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'bg:#083030'
format = '[[  $time ](fg:#30d0e0 bg:#083030)]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[[ $symbol$percentage ](fg:#30d0e0 bg:#083030)]($style)'

[[battery.display]]
threshold = 100
style = 'bg:#083030'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'bg:#083030'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'bg:#083030'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#180840'
format = '[[ $output ](fg:#9050f0 bg:#180840)]($style)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'bg:#080838'
format = '[[ $output ](fg:#6060ff bg:#080838)]($style)'
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'bg:#080838'
format = '[[ $output ](fg:#6060ff bg:#080838)]($style)'
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'bg:#080838'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[[ $output ](fg:#6060ff bg:#080838)]($style)'
shell = ["bash", "--noprofile", "--norc"]
