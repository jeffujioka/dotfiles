# ~/.config/starship.toml — bubble · Dusk palette  · deep · dark hue-shift
# Warm sunset: coral → rose → plum → indigo
# Swap: starship-picker

add_newline = true
command_timeout = 1000

format = """
[](fg:#d04060)[ $os ](fg:#0a0a0a bg:#d04060)[](fg:#d04060) \
[](fg:#280c12)$username\
$hostname\
$directory\
[](fg:#280c12) \
${custom.git_start}\
${custom.giticon}\
$git_branch\
$git_status\
${custom.git_end}\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
$fill\
[](fg:#0c0a28)$cmd_duration\
$battery\
$time\
[](fg:#0c081e)\
\n$character"""

continuation_prompt = '[](#d04060) '

[fill]
symbol = '─'
style = '#0c0a28'

[character]
success_symbol = '[❯](bold #ff9088)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'bg:#d04060'
format = '$symbol'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#ffaa77'
style_root = 'bold fg:#ff4444'
format = '[[ $user ](fg:#ffaa77 bg:#280c12)]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'bg:#280c12'
format = '[[@$hostname ](fg:#ffaa77 bg:#280c12)]($style)'
disabled = false

[directory]
style = 'bg:#280c12'
format = '[[ $path ](fg:#ffaa77 bg:#280c12)]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾'
read_only_style = 'fg:#ffaa77 bg:#280c12'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#1a0828'
format = '[[ $symbol$branch ](fg:#cc55bb bg:#1a0828)]($style)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#1a0828'
format = '[[($all_status$ahead_behind )](fg:#cc55bb bg:#1a0828)]($style)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'bg:#100830'
format = '[](fg:#100830)[ $symbol($version )(\($virtualenv\) ) ](fg:#9966ee bg:#100830)[](fg:#100830) '
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'bg:#100830'
format = '[](fg:#100830)[ $symbol ($version) ](fg:#9966ee bg:#100830)[](fg:#100830) '

[rust]
symbol = " "
style = 'bg:#100830'
format = '[](fg:#100830)[ $symbol ($version) ](fg:#9966ee bg:#100830)[](fg:#100830) '

[java]
symbol = " "
style = 'bg:#100830'
format = '[](fg:#100830)[ $symbol ($version) ](fg:#9966ee bg:#100830)[](fg:#100830) '

[c]
symbol = " "
style = 'bg:#100830'
format = '[](fg:#100830)[ $symbol ($version) ](fg:#9966ee bg:#100830)[](fg:#100830) '
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'bg:#100830'
format = '[](fg:#100830)[ $symbol $context ](fg:#9966ee bg:#100830)[](fg:#100830) '

[cmd_duration]
min_time = 2000
style = 'bg:#0c0a28'
format = '[[ ⏱ $duration ](fg:#6655aa bg:#0c0a28)]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'bg:#0c0a28'
format = '[[  $time ](fg:#6655aa bg:#0c0a28)]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[[ $symbol$percentage ](fg:#6655aa bg:#0c0a28)]($style)'

[[battery.display]]
threshold = 100
style = 'bg:#0c0a28'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'bg:#0c0a28'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'bg:#0c0a28'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.git_start]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#1a0828)'

[custom.git_end]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#1a0828) '

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#1a0828'
format = '[[ $output ](fg:#cc55bb bg:#1a0828)]($style)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'bg:#100830'
format = '[](fg:#100830)[ $output ](fg:#9966ee bg:#100830)[](fg:#100830) '
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'bg:#100830'
format = '[](fg:#100830)[ $output ](fg:#9966ee bg:#100830)[](fg:#100830) '
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'bg:#100830'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[](fg:#100830)[ $output ](fg:#9966ee bg:#100830)[](fg:#100830) '
shell = ["bash", "--noprofile", "--norc"]
