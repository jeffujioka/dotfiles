# ~/.config/starship.toml — powerline · Forest palette  · vivid · high contrast
# Woodland: canopy → moss → earth
# Swap: starship-picker

add_newline = true
command_timeout = 1000

format = """
[](#1a5c22)\
$os\
$username\
$hostname\
[](bg:#185020 fg:#1a5c22)\
$directory\
[](fg:#185020 bg:#1e4418)\
${custom.giticon}\
$git_branch\
$git_status\
[](fg:#1e4418 bg:#363008)\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
[](fg:#363008)\
$fill\
[](fg:#282200)\
$cmd_duration\
$battery\
$time\
[](fg:#282200)\
\n$character"""

continuation_prompt = '[](#10c050) '

[fill]
symbol = '─'
style = '#181500'

[character]
success_symbol = '[❯](bold #50c868)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'fg:#aaff99 bg:#1a5c22'
format = '[ $symbol ]($style)'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#aaff99 bg:#1a5c22'
style_root = 'fg:#aaff99 bg:#1a5c22'
format = '[ $user]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'fg:#aaff99 bg:#1a5c22'
format = '[@$hostname ]($style)'
disabled = false

[directory]
style = 'fg:#66ee88 bg:#185020'
format = '[ $path ]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾 '
read_only_style = 'fg:#66ee88 bg:#185020'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#1e4418'
format = '[ $symbol$branch ](fg:#aaee55 bg:#1e4418)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#1e4418'
format = '[$all_status$ahead_behind ](fg:#aaee55 bg:#1e4418)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'fg:#eedd44 bg:#363008'
format = '[ $symbol($version )(\($virtualenv\) )]($style)'
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'fg:#eedd44 bg:#363008'
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = 'fg:#eedd44 bg:#363008'
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = 'fg:#eedd44 bg:#363008'
format = '[ $symbol ($version) ]($style)'

[c]
symbol = " "
style = 'fg:#eedd44 bg:#363008'
format = '[ $symbol ($version) ]($style)'
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'fg:#eedd44 bg:#363008'
format = '[ $symbol $context ]($style)'

[cmd_duration]
min_time = 2000
style = 'fg:#ccaa33 bg:#282200'
format = '[ ⏱ $duration ]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'fg:#ccaa33 bg:#282200'
format = '[ 󱑍 $time ]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[ $symbol$percentage ]($style)'

[[battery.display]]
threshold = 100
style = 'fg:#ccaa33 bg:#282200'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'fg:#ccaa33 bg:#282200'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'fg:#ccaa33 bg:#282200'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote.sh"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#1e4418'
format = '[ $output ](fg:#aaee55 bg:#1e4418)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'fg:#eedd44 bg:#363008'
format = '[ $output ]($style)'
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'fg:#eedd44 bg:#363008'
format = '[ $output ]($style)'
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'fg:#eedd44 bg:#363008'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[ $output ]($style)'
shell = ["bash", "--noprofile", "--norc"]
