# ~/.config/starship.toml — bubble · Twilight palette  · vivid · high contrast
# Evening sky: lavender → violet → indigo → midnight
# Swap: starship-picker

add_newline = true
command_timeout = 1000

format = """
[](fg:#a060ff)[ $os ](fg:#0a0a0a bg:#a060ff)[](fg:#a060ff) \
[](fg:#3e1e70)$username\
$hostname\
$directory\
[](fg:#3e1e70) \
${custom.git_start}\
${custom.giticon}\
$git_branch\
$git_status\
${custom.git_end}\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
$fill\
[](fg:#100a30)$cmd_duration\
$battery\
$time\
[](fg:#0c081e)\
\n$character"""

continuation_prompt = '[](#a060ff) '

[fill]
symbol = '─'
style = '#100a30'

[character]
success_symbol = '[❯](bold #a070ff)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'bg:#a060ff'
format = '$symbol'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#eeccff'
style_root = 'bold fg:#ff4444'
format = '[[ $user ](fg:#eeccff bg:#3e1e70)]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'bg:#3e1e70'
format = '[[@$hostname ](fg:#eeccff bg:#3e1e70)]($style)'
disabled = false

[directory]
style = 'bg:#3e1e70'
format = '[[ $path ](fg:#eeccff bg:#3e1e70)]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾'
read_only_style = 'fg:#eeccff bg:#3e1e70'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#261260'
format = '[[ $symbol$branch ](fg:#aa88ff bg:#261260)]($style)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#261260'
format = '[[($all_status$ahead_behind )](fg:#aa88ff bg:#261260)]($style)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $symbol($version )(\($virtualenv\) ) ](fg:#8877ee bg:#180e48)[](fg:#180e48) '
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $symbol ($version) ](fg:#8877ee bg:#180e48)[](fg:#180e48) '

[rust]
symbol = " "
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $symbol ($version) ](fg:#8877ee bg:#180e48)[](fg:#180e48) '

[java]
symbol = " "
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $symbol ($version) ](fg:#8877ee bg:#180e48)[](fg:#180e48) '

[c]
symbol = " "
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $symbol ($version) ](fg:#8877ee bg:#180e48)[](fg:#180e48) '
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $symbol $context ](fg:#8877ee bg:#180e48)[](fg:#180e48) '

[cmd_duration]
min_time = 2000
style = 'bg:#100a30'
format = '[[ ⏱ $duration ](fg:#7766cc bg:#100a30)]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'bg:#100a30'
format = '[[  $time ](fg:#7766cc bg:#100a30)]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[[ $symbol$percentage ](fg:#7766cc bg:#100a30)]($style)'

[[battery.display]]
threshold = 100
style = 'bg:#100a30'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'bg:#100a30'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'bg:#100a30'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.git_start]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#261260)'

[custom.git_end]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#261260) '

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote.sh"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#261260'
format = '[[ $output ](fg:#aa88ff bg:#261260)]($style)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $output ](fg:#8877ee bg:#180e48)[](fg:#180e48) '
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'bg:#180e48'
format = '[](fg:#180e48)[ $output ](fg:#8877ee bg:#180e48)[](fg:#180e48) '
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'bg:#180e48'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[](fg:#180e48)[ $output ](fg:#8877ee bg:#180e48)[](fg:#180e48) '
shell = ["bash", "--noprofile", "--norc"]
