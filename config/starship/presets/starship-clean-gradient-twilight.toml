# ~/.config/starship.toml — clean · Twilight palette
# Evening sky: lavender → violet → indigo → midnight
# Swap: cp starship-clean-gradient-twilight.toml starship.toml

add_newline = true
command_timeout = 1000

format = """
[░▒▓](#8050e0)\
[ $os ](bg:#8050e0 fg:#0a0a0a)\
[](bg:#180c38 fg:#8050e0)\
$username\
$hostname\
$directory\
[](fg:#180c38 bg:#100c30)\
${custom.giticon}\
$git_branch\
$git_status\
[](fg:#100c30 bg:#0c0828)\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
[](fg:#0c0828 bg:#080820)\
$cmd_duration\
$battery\
$time\
[](fg:#080820)\
\n$character"""

continuation_prompt = '[▶▶](#8050e0) '

[fill]
symbol = '─'
style = '#080818'

[character]
success_symbol = '[❯](bold #a070ff)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'bg:#8050e0'
format = '$symbol'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#a070ff'
style_root = 'bold fg:#ff4444'
format = '[[ $user ](fg:#a070ff bg:#180c38)]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'bg:#180c38'
format = '[[@$hostname ](fg:#a070ff bg:#180c38)]($style)'
disabled = false

[directory]
style = 'bg:#180c38'
format = '[[ $path ](fg:#a070ff bg:#180c38)]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾'
read_only_style = 'fg:#a070ff bg:#180c38'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#100c30'
format = '[[ $symbol$branch ](fg:#5848b0 bg:#100c30)]($style)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#100c30'
format = '[[($all_status$ahead_behind )](fg:#5848b0 bg:#100c30)]($style)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'bg:#0c0828'
format = '[[ $symbol($version )(\($virtualenv\) )](fg:#4040a0 bg:#0c0828)]($style)'
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'bg:#0c0828'
format = '[[ $symbol ($version) ](fg:#4040a0 bg:#0c0828)]($style)'

[rust]
symbol = " "
style = 'bg:#0c0828'
format = '[[ $symbol ($version) ](fg:#4040a0 bg:#0c0828)]($style)'

[java]
symbol = " "
style = 'bg:#0c0828'
format = '[[ $symbol ($version) ](fg:#4040a0 bg:#0c0828)]($style)'

[c]
symbol = " "
style = 'bg:#0c0828'
format = '[[ $symbol ($version) ](fg:#4040a0 bg:#0c0828)]($style)'
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'bg:#0c0828'
format = '[[ $symbol $context ](fg:#4040a0 bg:#0c0828)]($style)'

[cmd_duration]
min_time = 2000
style = 'bg:#080820'
format = '[[ ⏱ $duration ](fg:#383890 bg:#080820)]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'bg:#080820'
format = '[[  $time ](fg:#383890 bg:#080820)]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[[ $symbol$percentage ](fg:#383890 bg:#080820)]($style)'

[[battery.display]]
threshold = 100
style = 'bg:#080820'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'bg:#080820'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'bg:#080820'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote.sh"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#100c30'
format = '[[ $output ](fg:#5848b0 bg:#100c30)]($style)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'bg:#0c0828'
format = '[[ $output ](fg:#4040a0 bg:#0c0828)]($style)'
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'bg:#0c0828'
format = '[[ $output ](fg:#4040a0 bg:#0c0828)]($style)'
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'bg:#0c0828'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[[ $output ](fg:#4040a0 bg:#0c0828)]($style)'
shell = ["bash", "--noprofile", "--norc"]
