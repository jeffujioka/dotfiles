# ~/.config/starship.toml — clean · Inferno palette
# Fire spectrum: yellow-ember → orange → red → crimson
# Swap: cp starship-clean-gradient-inferno.toml starship.toml

add_newline = true
command_timeout = 1000

format = """
[░▒▓](#e08020)\
[ $os ](bg:#e08020 fg:#0a0a0a)\
[](bg:#302008 fg:#e08020)\
$username\
$hostname\
$directory\
[](fg:#302008 bg:#280808)\
${custom.giticon}\
$git_branch\
$git_status\
[](fg:#280808 bg:#200808)\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
[](fg:#200808 bg:#180808)\
$cmd_duration\
$battery\
$time\
[](fg:#180808)\
\n$character"""

continuation_prompt = '[▶▶](#e05050) '

[fill]
symbol = '─'
style = '#180808'

[character]
success_symbol = '[❯](bold #ffc830)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'bg:#e08020'
format = '$symbol'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#ffc830'
style_root = 'bold fg:#ff4444'
format = '[[ $user ](fg:#ffc830 bg:#302008)]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'bg:#302008'
format = '[[@$hostname ](fg:#ffc830 bg:#302008)]($style)'
disabled = false

[directory]
style = 'bg:#302008'
format = '[[ $path ](fg:#ffc830 bg:#302008)]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾'
read_only_style = 'fg:#ffc830 bg:#302008'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#280808'
format = '[[ $symbol$branch ](fg:#f05030 bg:#280808)]($style)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#280808'
format = '[[($all_status$ahead_behind )](fg:#f05030 bg:#280808)]($style)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'bg:#200808'
format = '[[ $symbol($version )(\($virtualenv\) )](fg:#d03828 bg:#200808)]($style)'
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'bg:#200808'
format = '[[ $symbol ($version) ](fg:#d03828 bg:#200808)]($style)'

[rust]
symbol = " "
style = 'bg:#200808'
format = '[[ $symbol ($version) ](fg:#d03828 bg:#200808)]($style)'

[java]
symbol = " "
style = 'bg:#200808'
format = '[[ $symbol ($version) ](fg:#d03828 bg:#200808)]($style)'

[c]
symbol = " "
style = 'bg:#200808'
format = '[[ $symbol ($version) ](fg:#d03828 bg:#200808)]($style)'
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'bg:#200808'
format = '[[ $symbol $context ](fg:#d03828 bg:#200808)]($style)'

[cmd_duration]
min_time = 2000
style = 'bg:#180808'
format = '[[ ⏱ $duration ](fg:#a83828 bg:#180808)]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'bg:#180808'
format = '[[  $time ](fg:#a83828 bg:#180808)]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[[ $symbol$percentage ](fg:#a83828 bg:#180808)]($style)'

[[battery.display]]
threshold = 100
style = 'bg:#180808'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'bg:#180808'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'bg:#180808'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote.sh"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#280808'
format = '[[ $output ](fg:#f05030 bg:#280808)]($style)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'bg:#200808'
format = '[[ $output ](fg:#d03828 bg:#200808)]($style)'
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'bg:#200808'
format = '[[ $output ](fg:#d03828 bg:#200808)]($style)'
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'bg:#200808'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[[ $output ](fg:#d03828 bg:#200808)]($style)'
shell = ["bash", "--noprofile", "--norc"]
