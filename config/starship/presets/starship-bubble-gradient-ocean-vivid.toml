# ~/.config/starship.toml — bubble · Ocean palette  · vivid · high contrast
# Deep water: turquoise → teal → blue → navy
# Swap: starship-picker

add_newline = true
command_timeout = 1000

format = """
[](fg:#00d8f0)[ $os ](fg:#0a0a0a bg:#00d8f0)[](fg:#00d8f0) \
[](fg:#125858)$username\
$hostname\
$directory\
[](fg:#125858) \
${custom.git_start}\
${custom.giticon}\
$git_branch\
$git_status\
${custom.git_end}\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
$fill\
[](fg:#080a3c)$cmd_duration\
$battery\
$time\
[](fg:#0c081e)\
\n$character"""

continuation_prompt = '[](#0aa0c0) '

[fill]
symbol = '─'
style = '#080a3c'

[character]
success_symbol = '[❯](bold #40e0d0)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'bg:#00d8f0'
format = '$symbol'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#66ffee'
style_root = 'bold fg:#ff4444'
format = '[[ $user ](fg:#66ffee bg:#125858)]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'bg:#125858'
format = '[[@$hostname ](fg:#66ffee bg:#125858)]($style)'
disabled = false

[directory]
style = 'bg:#125858'
format = '[[ $path ](fg:#66ffee bg:#125858)]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾'
read_only_style = 'fg:#66ffee bg:#125858'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#102460'
format = '[[ $symbol$branch ](fg:#66aaff bg:#102460)]($style)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#102460'
format = '[[($all_status$ahead_behind )](fg:#66aaff bg:#102460)]($style)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $symbol($version )(\($virtualenv\) ) ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $symbol ($version) ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '

[rust]
symbol = " "
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $symbol ($version) ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '

[java]
symbol = " "
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $symbol ($version) ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '

[c]
symbol = " "
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $symbol ($version) ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $symbol $context ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '

[cmd_duration]
min_time = 2000
style = 'bg:#080a3c'
format = '[[ ⏱ $duration ](fg:#7788ee bg:#080a3c)]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'bg:#080a3c'
format = '[[  $time ](fg:#7788ee bg:#080a3c)]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[[ $symbol$percentage ](fg:#7788ee bg:#080a3c)]($style)'

[[battery.display]]
threshold = 100
style = 'bg:#080a3c'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'bg:#080a3c'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'bg:#080a3c'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.git_start]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#102460)'

[custom.git_end]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#102460) '

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote.sh"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#102460'
format = '[[ $output ](fg:#66aaff bg:#102460)]($style)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $output ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'bg:#0e1060'
format = '[](fg:#0e1060)[ $output ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'bg:#0e1060'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[](fg:#0e1060)[ $output ](fg:#aaaaff bg:#0e1060)[](fg:#0e1060) '
shell = ["bash", "--noprofile", "--norc"]
