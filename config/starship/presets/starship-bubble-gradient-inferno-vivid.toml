# ~/.config/starship.toml — bubble · Inferno palette  · vivid · high contrast
# Fire spectrum: yellow-ember → orange → red → crimson
# Swap: starship-picker

add_newline = true
command_timeout = 1000

format = """
[](fg:#e08020)[ $os ](fg:#0a0a0a bg:#e08020)[](fg:#e08020) \
[](fg:#6e4000)$username\
$hostname\
$directory\
[](fg:#6e4000) \
${custom.git_start}\
${custom.giticon}\
$git_branch\
$git_status\
${custom.git_end}\
${custom.tmux_zoom}\
$python\
$nodejs\
$rust\
$java\
$c\
${custom.cpp}\
${custom.vpn}\
$docker_context\
$fill\
[](fg:#280018)$cmd_duration\
$battery\
$time\
[](fg:#0c081e)\
\n$character"""

continuation_prompt = '[](#e05050) '

[fill]
symbol = '─'
style = '#280018'

[character]
success_symbol = '[❯](bold #ffc830)'
error_symbol = '[❯](bold #ff4444)'

[os]
style = 'bg:#e08020'
format = '$symbol'
disabled = false

[os.symbols]
Macos = '󰀵'
Ubuntu = ""
Linux = ""

[username]
style_user = 'fg:#ffe566'
style_root = 'bold fg:#ff4444'
format = '[[ $user ](fg:#ffe566 bg:#6e4000)]($style)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = 'bg:#6e4000'
format = '[[@$hostname ](fg:#ffe566 bg:#6e4000)]($style)'
disabled = false

[directory]
style = 'bg:#6e4000'
format = '[[ $path ](fg:#ffe566 bg:#6e4000)]($style)'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only = ' 󰌾'
read_only_style = 'fg:#ffe566 bg:#6e4000'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = 'bg:#5a0000'
format = '[[ $symbol$branch ](fg:#ffaa33 bg:#5a0000)]($style)'
truncation_symbol = '…/'

[git_status]
style = 'bg:#5a0000'
format = '[[($all_status$ahead_behind )](fg:#ffaa33 bg:#5a0000)]($style)'
up_to_date = ''
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
deleted = '-${count} '
conflicted = '!${count} '
stashed = '\$${count} '

[python]
symbol = " "
style = 'bg:#380028'
format = '[](fg:#380028)[ $symbol($version )(\($virtualenv\) ) ](fg:#ff55cc bg:#380028)[](fg:#380028) '
pyenv_version_name = true

[nodejs]
symbol = " "
style = 'bg:#380028'
format = '[](fg:#380028)[ $symbol ($version) ](fg:#ff55cc bg:#380028)[](fg:#380028) '

[rust]
symbol = " "
style = 'bg:#380028'
format = '[](fg:#380028)[ $symbol ($version) ](fg:#ff55cc bg:#380028)[](fg:#380028) '

[java]
symbol = " "
style = 'bg:#380028'
format = '[](fg:#380028)[ $symbol ($version) ](fg:#ff55cc bg:#380028)[](fg:#380028) '

[c]
symbol = " "
style = 'bg:#380028'
format = '[](fg:#380028)[ $symbol ($version) ](fg:#ff55cc bg:#380028)[](fg:#380028) '
detect_extensions = ['.c']

[docker_context]
symbol = " "
style = 'bg:#380028'
format = '[](fg:#380028)[ $symbol $context ](fg:#ff55cc bg:#380028)[](fg:#380028) '

[cmd_duration]
min_time = 2000
style = 'bg:#280018'
format = '[[ ⏱ $duration ](fg:#ff3366 bg:#280018)]($style)'

[time]
disabled = false
time_format = "%d/%m/%y %H:%M"
style = 'bg:#280018'
format = '[[  $time ](fg:#ff3366 bg:#280018)]($style)'

[battery]
disabled = false
full_symbol = '󱊣'
charging_symbol = '󱊦'
discharging_symbol = '󱊣'
format = '[[ $symbol$percentage ](fg:#ff3366 bg:#280018)]($style)'

[[battery.display]]
threshold = 100
style = 'bg:#280018'

[[battery.display]]
threshold = 50
charging_symbol = '󱊥'
discharging_symbol = '󱊢'
style = 'bg:#280018'

[[battery.display]]
threshold = 20
charging_symbol = '󱊤'
discharging_symbol = '󱊡'
style = 'bg:#280018'

[[battery.display]]
threshold = 10
charging_symbol = '󰨜'
discharging_symbol = '󴃍'
style = 'bg:#c0392b'

[custom.git_start]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#5a0000)'

[custom.git_end]
disabled = false
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
command = 'echo ""'
shell = ["bash", "--noprofile", "--norc"]
format = '[](fg:#5a0000) '

[custom.giticon]
disabled = false
description = "Display symbol for remote Git server"
command = "check-git-remote"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
style = 'bg:#5a0000'
format = '[[ $output ](fg:#ffaa33 bg:#5a0000)]($style)'

[custom.cpp]
description = "custom C++ config"
command = 'echo '
detect_extensions = ['.h', '.hpp', 'cpp', '.cc']
style = 'bg:#380028'
format = '[](fg:#380028)[ $output ](fg:#ff55cc bg:#380028)[](fg:#380028) '
when = true

[custom.vpn]
disabled = false
command = 'echo  󰓄'
style = 'bg:#380028'
format = '[](fg:#380028)[ $output ](fg:#ff55cc bg:#380028)[](fg:#380028) '
when = 'ip route show | grep vpntun0 | awk "{ print $1 }" | grep "^53\." || corporate-vpn -s | grep -w "Connection Established"'

[custom.tmux_zoom]
disabled = false
description = "Show indicator when tmux pane is zoomed"
command = 'echo "󰖗 zoom"'
style = 'bg:#380028'
when = '[ -n "$TMUX" ] && [ "$(tmux display-message -p "#{window_zoomed_flag}")" = "1" ]'
format = '[](fg:#380028)[ $output ](fg:#ff55cc bg:#380028)[](fg:#380028) '
shell = ["bash", "--noprofile", "--norc"]
